<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Anthony</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0D0D0D;
            font-family: sans-serif;
        }

        /* MENU */
        .barnav {
            background-color: #0D0D0D;
            width: 100%;
            height: 60px;
            padding: 20px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .barnav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .barnav li {
            font-size: 15px;
            font-weight: bold;
        }

        .barnav li a {
            color: #EFE5D2;
            text-decoration: none;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        .barnav li a:hover {
            color: #C28D39;
            border-bottom: 2px solid #C28D39;
        }

        /* BANNER */
        .banner {
            width: 100%;
            height: calc(100vh - 60px);
            min-height: 520px;

            background-image:
                linear-gradient(
                    rgba(13,13,13,.30),
                    rgba(13,13,13,.45)
                ),
                url('img67.jpeg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 10px;
            gap: 8px;
            overflow: hidden;
        }

        /* LOGO */
        .logo {
            width: 130px;
            height: auto;
            margin-bottom: 1px;
        }

        /* ESLOGAN  */
        .eslogan {
            color: #EFE5D2;
            font-size: clamp(22px, 3.2vw, 36px);
            font-family: Georgia, serif;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            max-width: 900px;
            line-height: 1.15;
            text-shadow: 3px 3px 10px #000000;
        }

        .eslogan span {
            color: #C28D39;
        }

        /* GALERIA */
        .dwc-galeria {
            width: 100%;
            padding: 2px 0;
            overflow: hidden;
        }

        .dwc-titulo-galeria {
            text-align: center;
            margin-bottom: 8px;
        }

        .dwc-titulo-galeria h2 {
            font-size: 20px;
            color: #EFE5D2;
        }

        .dwc-titulo-galeria span {
            color: #C28D39;
        }

        /* CARRUSEL */
        .dwc-marco {
            width: 100%;
            overflow: hidden;
        }

        .dwc-pista {
            display: flex;
            gap: 15px;
            width: max-content;
            animation: mover 30s linear infinite;
        }

        .dwc-pista img {
            width: 210px;
            height: 270px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid #C28D39;
            border-radius: 5px;
        }

        @keyframes mover {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* TEXTO INFERIOR */
        .dwc-nota-ficcion {
            color: #EFE5D2;
            text-align: center;
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* CELULARES */
        @media (max-width: 768px) {

            .barnav {
                height: auto;
                padding: 10px;
            }

            .barnav ul {
                gap: 12px;
            }

            .barnav li {
                font-size: 11px;
            }

            .banner {
                height: auto;
                min-height: calc(100vh - 80px);
                padding: 10px;
            }

            .logo {
                width: 85px;
            }

            .eslogan {
                font-size: 22px;
            }

            .dwc-titulo-galeria h2 {
                font-size: 17px;
            }

            .dwc-pista img {
                width: 140px;
                height: 180px;
            }
        }

    </style>
</head>

<body>

    <!-- MENU -->
    <nav class="barnav">
        <ul>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="catalogo.html">Cortes</a></li>
            <li><a href="Catproductos.html">Productos</a></li>
            <li><a href="paquetes.html">Paquetes</a></li>
            <li><a href="Reservacion.html">Agendar Cita</a></li>
            <li><a href="ubicacion.html">Sucursales</a></li>
            <li><a href="politicas.html">Politicas</a></li>
            <li><a href="barberos.html">Barberos</a></li>
        </ul>
    </nav>

    <!-- BANNER PRINCIPAL -->
    <div class="banner">

        <img class="logo" src="logo.png" alt="Logo de Barbería Anthony">

        <h2 class="eslogan">
            ESTILO QUE SE NOTA,<br>
            <span>CALIDAD QUE SE SIENTE.</span>
        </h2>

        <!-- CARRUSEL DE EXPEDIENTES -->
        <section class="dwc-galeria" id="expedientes">

            <div class="dwc-titulo-galeria">
                <h2>CORTES <span>REALIZADOS</span></h2>
            </div>

            <div class="dwc-marco">
                <div class="dwc-pista">

                    <img src="imagenes/v1.jpeg" alt="Retrato ficticio 1">
                    <img src="imagenes/v2.jpeg" alt="Retrato ficticio 2">
                    <img src="imagenes/v3.jpeg" alt="Retrato ficticio 3">
                    <img src="imagenes/v4.jpeg" alt="Retrato ficticio 4">
                    <img src="imagenes/v5.jpeg" alt="Retrato ficticio 5">
                    <img src="imagenes/v6.jpeg" alt="Retrato ficticio 6">
                    <img src="imagenes/v7.jpeg" alt="Retrato ficticio 7">
                    <img src="imagenes/v8.jpeg" alt="Retrato ficticio 8">

                    <!-- IMAGENES REPETIDAS PARA MOVIMIENTO CONTINUO -->
                    <img src="imagenes/v1.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v2.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v3.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v4.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v5.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v6.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v7.jpeg" alt="" aria-hidden="true">
                    <img src="imagenes/v8.jpeg" alt="" aria-hidden="true">

                </div>
            </div>

            <p class="dwc-nota-ficcion">
                AGENDA YA
            </p>

        </section>

    </div>

</body>
</html>
