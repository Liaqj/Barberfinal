<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <style>
        /* Estilos generales */
        body {
            background-color: #0d0d0d; /* Fondo negro elegante */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #d4af37; /* Título en dorado */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }

        /* Contenedor del catálogo */
        .catalogo {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
        }

        /* Tarjeta de cada producto */
        .producto {
            background-color: #161616; /* Fondo de la tarjeta */
            border: 1px solid #2b2b2b;
            border-radius: 8px;
            width: 300px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .producto:hover {
            transform: translateY(-5px);
            border-color: #d4af37; /* Se ilumina en dorado al pasar el mouse */
        }

        /* Imagen del producto */
        .producto img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #2b2b2b;
        }

        /* Información del producto */
        .info-producto {
            padding: 20px;
            text-align: center;
        }

        .info-producto h3 {
            color: #d4af37; /* Nombre del producto en dorado */
            margin: 0 0 15px 0;
            font-size: 1.2rem;
        }

        .info-producto p {
            margin: 8px 0;
            font-size: 0.95rem;
            color: #cccccc;
        }

        /* Toque sutil de rojo para resaltar precios o ganancias */
        .precio {
            color: #ff4d4d !important; /* Rojo elegante */
            font-weight: bold;
        }

        .ganancia {
            color: #e6e6e6;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>PRODUCTOS</h1>

    <div class="catalogo">
        <!-- Producto 1: Cera para cabello -->
        <div class="producto">
            <!-- Reemplaza 'ruta-cera.jpg' con el enlace o nombre de tu imagen -->
            <img src="ruta-cera.jpg" alt="Cera para cabello">
            <div class="info-producto">
                <h3>Cera para cabello</h3>
                <p>Precio de venta: <span class="precio">$129</span></p>
                <p class="ganancia">Ganancia estimada: $29</p>
            </div>
        </div>

        <!-- Producto 2: Pomada -->
        <div class="producto">
            <!-- Reemplaza 'ruta-pomada.jpg' con el enlace o nombre de tu imagen -->
            <img src="ruta-pomada.jpg" alt="Pomada">
            <div class="info-producto">
                <h3>Pomada</h3>
                <p>Precio de venta: <span class="precio">$149</span></p>
                <p class="ganancia">Ganancia estimada: $39</p>
            </div>
        </div>

        <!-- Producto 3: Shampoo -->
        <div class="producto">
            <!-- Reemplaza 'ruta-shampoo.jpg' con el enlace o nombre de tu imagen -->
            <img src="ruta-shampoo.jpg" alt="Shampoo">
            <div class="info-producto">
                <h3>Shampoo</h3>
                <p>Precio de venta: <span class="precio">$120</span></p>
                <p class="ganancia">Ganancia estimada: $20</p>
            </div>
        </div>
    </div>

</body>
</html>
